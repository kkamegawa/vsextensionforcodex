name: CI

on:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    # Skip pull requests from forks: a fork PR cannot supply CODEX_PATH-worthy
    # secrets and should not consume Windows runner minutes on this repository.
    # Tag pushes and same-repository pull requests still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read # least-privilege for checkout

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # global.json pins the 10.0 SDK; the 8.0 SDK supplies the runtime the net8.0 tests need.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Codex CLI
        id: install_codex
        shell: pwsh
        run: |
          # Codex.AppServer.Protocol generates schemas/ during the build by calling the Codex CLI,
          # so the runner needs one. winget is the supported install method for this extension.
          winget install --id OpenAI.Codex --source winget --silent `
            --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "winget failed to install the Codex CLI (exit code $LASTEXITCODE)."
          }

          # winget updates the persisted PATH, which the current process does not see yet.
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' +
            [Environment]::GetEnvironmentVariable('PATH', 'User')
          $codex = Get-Command codex -CommandType Application -All -ErrorAction SilentlyContinue |
            Where-Object { $_.Source -notmatch '[\\/]WindowsApps[\\/]' } |
            Select-Object -First 1
          if (-not $codex) {
            throw "The Codex CLI was installed but no usable executable was found on PATH."
          }

          & $codex.Source --version

          # Scoped to this step's output rather than $GITHUB_ENV: exporting CODEX_PATH job-wide
          # would leak into the test steps below and break CodexExecutableResolver unit tests
          # that assert behavior with CODEX_PATH unset (it always wins resolution when set).
          "codex_path=$($codex.Source)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore CodexForVisualStudio.slnx

      - name: Build solution
        env:
          CODEX_PATH: ${{ steps.install_codex.outputs.codex_path }}
        run: dotnet build CodexForVisualStudio.slnx -c Release --no-restore -v minimal

      - name: Test core
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            dotnet test tests\Codex.VisualStudio.Core.Tests\Codex.VisualStudio.Core.Tests.csproj -c Release --no-build -v minimal
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "Test core failed after $maxAttempts attempts (exit code $LASTEXITCODE)."
            }
            Write-Warning "Test core attempt $attempt failed (exit code $LASTEXITCODE); retrying in 5s..."
            Start-Sleep -Seconds 5
          }
      - name: Test UI
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            dotnet test tests\Codex.VisualStudio.Ui.Tests\Codex.VisualStudio.Ui.Tests.csproj -c Release --no-build -v minimal
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "Test UI failed after $maxAttempts attempts (exit code $LASTEXITCODE)."
            }
            Write-Warning "Test UI attempt $attempt failed (exit code $LASTEXITCODE); retrying in 5s..."
            Start-Sleep -Seconds 5
          }

      - name: Verify VSIX exists
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path .\src\Codex.VisualStudio.Extension\bin\Release -Filter *.vsix -Recurse
          if (-not $vsix) {
            throw "VSIX artifact was not generated."
          }

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexForVisualStudio-vsix
          path: src\Codex.VisualStudio.Extension\bin\Release\**\*.vsix
