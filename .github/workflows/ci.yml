name: CI

on:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  generate-schemas:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["0.154.0", "0.155.1"]
        surface: [stable, experimental]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download pinned Codex CLI
        shell: pwsh
        env:
          CODEX_VERSION: ${{ matrix.version }}
        run: |
          $contract = Get-Content -Raw app-server-contract.json | ConvertFrom-Json
          $release = $contract.releases.($env:CODEX_VERSION)
          $uri = "https://github.com/openai/codex/releases/download/$($release.tag)/$($release.asset)"
          $path = Join-Path $env:RUNNER_TEMP $release.asset
          Invoke-WebRequest -Uri $uri -OutFile $path
          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $release.sha256) { throw "SHA-256 mismatch for $uri: $actual" }
          "CODEX_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate schema surface
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/generate-schemas.ps1 -OutputDirectory schemas `
            -Version '${{ matrix.version }}' -Surface '${{ matrix.surface }}' -CodexPath "$env:CODEX_PATH"
      - name: Verify schema cache contract
        if: matrix.version == '0.155.1' && matrix.surface == 'stable'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-schema-cache.ps1 -CodexPath "$env:CODEX_PATH"
      - name: Upload schema cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemas-${{ matrix.version }}-${{ matrix.surface }}
          path: schemas
          include-hidden-files: true

  verify-schemas:
    runs-on: windows-latest
    needs: generate-schemas
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download schema caches
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          pattern: schemas-*
          path: schemas
          merge-multiple: true
      - name: Compare stable schema baseline and target
        shell: pwsh
        run: pwsh -NoProfile -File scripts/compare-schemas.ps1 -BaselineDirectory schemas/0.154.0/stable -TargetDirectory schemas/0.155.1/stable -Surface stable
      - name: Compare experimental schema baseline and target
        shell: pwsh
        run: pwsh -NoProfile -File scripts/compare-schemas.ps1 -BaselineDirectory schemas/0.154.0/experimental -TargetDirectory schemas/0.155.1/experimental -Surface experimental
      - name: Verify target stable method surface
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-contract-surface.ps1 -SchemaDirectory schemas/0.155.1/stable
      - name: Verify target experimental method surface
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-contract-surface.ps1 -SchemaDirectory schemas/0.155.1/experimental

  build:
    runs-on: windows-latest
    needs: [generate-schemas, verify-schemas]
    # Skip pull requests from forks: a fork PR cannot supply CODEX_PATH-worthy
    # secrets and should not consume Windows runner minutes on this repository.
    # Tag pushes and same-repository pull requests still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read # least-privilege for checkout

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # global.json pins the 10.0 SDK; the 8.0 SDK supplies the runtime the net8.0 tests need.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download generated schema caches
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          pattern: schemas-*
          path: schemas
          merge-multiple: true

      - name: Restore
        run: dotnet restore CodexForVisualStudio.slnx

      - name: Build solution
        run: dotnet build CodexForVisualStudio.slnx -c Release --no-restore -v minimal

      - name: Test core
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            dotnet test tests\Codex.VisualStudio.Core.Tests\Codex.VisualStudio.Core.Tests.csproj -c Release --no-build -v minimal
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "Test core failed after $maxAttempts attempts (exit code $LASTEXITCODE)."
            }
            Write-Warning "Test core attempt $attempt failed (exit code $LASTEXITCODE); retrying in 5s..."
            Start-Sleep -Seconds 5
          }
      - name: Test UI
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            dotnet test tests\Codex.VisualStudio.Ui.Tests\Codex.VisualStudio.Ui.Tests.csproj -c Release --no-build -v minimal
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "Test UI failed after $maxAttempts attempts (exit code $LASTEXITCODE)."
            }
            Write-Warning "Test UI attempt $attempt failed (exit code $LASTEXITCODE); retrying in 5s..."
            Start-Sleep -Seconds 5
          }

      - name: Find VSIX
        id: find_vsix
        shell: pwsh
        run: |
          # Search recursively so the step is not sensitive to the framework sub-folder name.
          # Resolving a single literal path (rather than a glob) keeps the .vsix at the root
          # of the uploaded artifact zip instead of nested under a TFM sub-folder.
          $vsix = Get-ChildItem -Path .\src\Codex.VisualStudio.Extension\bin\Release -Filter *.vsix -Recurse |
                    Sort-Object LastWriteTimeUtc -Descending |
                    Select-Object -First 1
          if (-not $vsix) {
            throw "VSIX artifact was not generated."
          }
          Write-Host "Found VSIX: $($vsix.FullName)"
          "vsix_path=$($vsix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexForVisualStudio-vsix
          path: ${{ steps.find_vsix.outputs.vsix_path }}

